<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play - AI Storytelling Co-Author</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand-theme.css">
<link rel="stylesheet" href="../brand-components.css">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./play.css">
</head>
<body class="light-theme">
<div id="app-topbar"></div>
<div class="page-play">
  <header class="play-topbar">
    <h1 id="book-title">Loading your story...</h1>
    <button id="diary-btn" data-testid="diary-btn" class="btn btn-secondary" type="button">Diary</button>
    <button id="reset-btn" data-testid="reset-btn" class="btn btn-secondary" type="button" aria-label="Reset the story and start over">Reset</button>
  </header>
  <div id="play-status" class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Loading the book...</span></div>

  <div id="play-layout" class="play-layout" hidden>
    <section class="pane-read">
      <article id="prose" class="prose" data-testid="prose"></article>
      <details class="bible-box">
        <summary data-testid="bible-toggle">Story bible summary</summary>
        <div id="bible-summary"></div>
      </details>
    </section>

    <aside class="pane-play">
      <div id="diary-panel" class="diary-panel" hidden>
        <h2>Story diary</h2>
        <ul id="diary-list"></ul>
        <p id="diary-empty" class="play-note">No diary entries yet - they appear as the story unfolds.</p>
      </div>
      <p id="play-note" class="play-note" hidden></p>
      <!-- Composer (Emochi-style, Hieu Oct 27): the suggestions
           live in a sheet directly above one rounded input bar;
           the bar's toolbar carries the two icons - Suggestion
           (toggles the sheet) and Continue. -->
      <div class="composer-wrap">
        <!-- Scene audio transport (stream-audio v1, T3):
             hidden until something plays; pause/resume and
             stop control the current reading, mute persists
             per user. None of these change the auto-speak
             flag. -->
        <div id="audio-transport" class="audio-transport" hidden>
          <button id="audio-pause-btn" data-testid="audio-pause-btn" class="tool-btn" type="button" aria-label="Pause listening">Pause</button>
          <button id="audio-stop-btn" data-testid="audio-stop-btn" class="tool-btn" type="button" aria-label="Stop listening">Stop</button>
          <button id="audio-mute-btn" data-testid="audio-mute-btn" class="tool-btn" type="button" aria-label="Mute">Mute</button>
        </div>
        <div id="suggest-panel" class="suggest-panel suggest-sheet" hidden>
          <div class="suggestions">
            <button class="suggestion-card" data-testid="suggestion-1" type="button" aria-label="Suggestion 1">Loading...</button>
            <button class="suggestion-card" data-testid="suggestion-2" type="button" aria-label="Suggestion 2">Loading...</button>
            <button class="suggestion-card" data-testid="suggestion-3" type="button" aria-label="Suggestion 3">Loading...</button>
          </div>
          <div class="turn-tools">
            <button id="retry-btn" data-testid="retry-btn" class="btn btn-secondary" type="button" disabled aria-disabled="true">Retry</button>
            <button id="correct-btn" data-testid="correct-btn" class="btn btn-secondary" type="button" disabled aria-disabled="true">Correct <span class="badge">Soon</span></button>
          </div>
        </div>
        <div class="composer">
          <textarea id="action-input" data-testid="action-input" class="input" rows="1"
            placeholder="What do you do? (*...* = instruction for the AI)"></textarea>
          <div class="composer-bar">
            <div class="composer-icons">
              <button id="suggest-toggle" data-testid="suggest-toggle" class="tool-btn" type="button"
                aria-expanded="false" aria-controls="suggest-panel" title="Show suggestions" aria-label="Show suggestions"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.3 2.2h4.6c.2-.9.6-1.6 1.3-2.2A6 6 0 0 0 12 3z"/></svg></button>
              <button id="continue-btn" data-testid="continue-btn" class="tool-btn" type="button"
                title="Continue the story" aria-label="Continue the story"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4.5 12.5 12 5 19.5zM12.5 4.5 20 12l-7.5 7.5z"/></svg></button>
            </div>
            <!-- Stream replies toggle: binds the localStorage
                 key writer.streamReplies ("1" = on) - the same
                 key the future reading-settings panel will use. -->
            <label class="stream-toggle" title="Show each scene as it is written">
              <input id="stream-toggle" data-testid="stream-toggle" type="checkbox">
              Stream
            </label>
            <!-- Scene audio (stream-audio v1, T3): auto-speak
                 flag (OFF by default, writer.autoSpeak) and
                 narrator voice (writer.narratorVoice) on the
                 same localStorage contract the future
                 reading-settings panel will bind to. -->
            <label class="stream-toggle" title="Read each new scene aloud automatically once its audio is ready">
              <input id="auto-speak-toggle" data-testid="auto-speak-toggle" type="checkbox">
              Auto-speak
            </label>
            <label class="voice-select" title="Narrator voice">
              Voice
              <select id="narrator-voice" data-testid="narrator-voice">
                <option value="vendetti">Vendetti</option>
                <option value="klett">Klett</option>
              </select>
            </label>
            <p class="input-hint">Enter to send &middot; Shift+Enter for a new line</p>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <p id="play-out" hidden>You are not signed in.
    <a href="./login.html">Sign in</a> to play.</p>
</div>
<script type="module" src="./play.js"></script>
</body>
</html>
