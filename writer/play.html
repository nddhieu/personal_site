<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play - Story Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand-theme.css">
<link rel="stylesheet" href="../brand-components.css">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./play.css">
</head>
<body class="light-theme">
<div id="app-topbar"></div>
<div class="page-play">
  <header class="play-topbar">
    <h1 id="book-title">Loading your story...</h1>
    <!-- Header menu (Hieu, Nov 7): Diary, Reset story, Theme and
         Log out used to be four standalone buttons eating a row
         under this header (Diary + Reset here, Theme + Log out in
         the shared topbar). They now live behind this one menu
         button; the items keep the diary/reset ids so play.js's
         handlers are unchanged, and init() removes the topbar's
         Theme / Log out buttons on this page only. -->
    <!-- Background adjust (Hieu, Nov 8): with a scene
         background active, this icon button enters adjust
         mode - drag the image to reposition it, Fill / Fit
         chooses how it meets the screen. Icon-only per the
         standing mobile rule; CSS shows it only while the
         page carries a background (.has-scene-bg). -->
    <button id="bg-adjust-btn" data-testid="bg-adjust-btn" class="btn btn-secondary bg-adjust-btn" type="button"
      aria-label="Adjust background" title="Adjust background" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18"/><path d="M8.5 6.5 12 3l3.5 3.5"/><path d="M8.5 17.5 12 21l3.5-3.5"/><path d="M3 12h18"/><path d="M6.5 8.5 3 12l3.5 3.5"/><path d="M17.5 8.5 21 12l-3.5 3.5"/></svg></button>
    <div id="play-menu-wrap" class="play-menu-wrap">
      <button id="play-menu-btn" data-testid="play-menu-btn" class="btn btn-secondary play-menu-btn" type="button"
        aria-haspopup="true" aria-expanded="false" aria-controls="play-menu" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div id="play-menu" data-testid="play-menu" class="play-menu" role="menu" aria-label="Story menu" hidden>
        <button id="diary-btn" data-testid="diary-btn" class="play-menu-item" type="button" role="menuitem">Diary</button>
        <button id="reset-btn" data-testid="reset-btn" class="play-menu-item" type="button" role="menuitem" aria-label="Reset the story and start over">Reset story</button>
        <button id="play-menu-theme" data-testid="play-menu-theme" class="play-menu-item" type="button" role="menuitem" aria-label="Switch color theme">Dark</button>
        <button id="play-menu-logout" data-testid="play-menu-logout" class="play-menu-item" type="button" role="menuitem">Log out</button>
      </div>
    </div>
  </header>
  <div id="play-status" class="loading-row"><span class="spinner" aria-hidden="true"></span><span>Loading the book...</span></div>

  <div id="play-layout" class="play-layout" hidden>
    <section class="pane-read">
      <article id="prose" class="prose" data-testid="prose"></article>
      <details class="bible-box">
        <summary data-testid="bible-toggle">Story bible summary</summary>
        <div id="bible-summary"></div>
      </details>
    </section>

    <aside class="pane-play">
      <div id="diary-panel" class="diary-panel" hidden>
        <h2>Story diary</h2>
        <ul id="diary-list"></ul>
        <p id="diary-empty" class="play-note">No diary entries yet - they appear as the story unfolds.</p>
      </div>
      <p id="play-note" class="play-note" hidden></p>
      <!-- Composer (Emochi-style, Hieu Oct 27): the suggestions
           live in a sheet directly above one rounded input bar;
           the bar's toolbar carries the two icons - Suggestion
           (toggles the sheet) and Continue. -->
      <div class="composer-wrap">
        <!-- Scene audio transport (stream-audio v1, T3):
             hidden until something plays; pause/resume and
             stop control the current reading, mute persists
             per user. None of these change the auto-speak
             flag. -->
        <div id="audio-transport" class="audio-transport" hidden>
          <button id="audio-pause-btn" data-testid="audio-pause-btn" class="tool-btn" type="button" aria-label="Pause listening">Pause</button>
          <button id="audio-stop-btn" data-testid="audio-stop-btn" class="tool-btn" type="button" aria-label="Stop listening">Stop</button>
          <button id="audio-mute-btn" data-testid="audio-mute-btn" class="tool-btn" type="button" aria-label="Mute">Mute</button>
        </div>
        <div id="suggest-panel" class="suggest-panel suggest-sheet" hidden>
          <div class="suggestions">
            <button class="suggestion-card" data-testid="suggestion-1" type="button" aria-label="Suggestion 1">Loading...</button>
            <button class="suggestion-card" data-testid="suggestion-2" type="button" aria-label="Suggestion 2">Loading...</button>
            <button class="suggestion-card" data-testid="suggestion-3" type="button" aria-label="Suggestion 3">Loading...</button>
          </div>
          <div class="turn-tools">
            <button id="retry-btn" data-testid="retry-btn" class="btn btn-secondary" type="button" disabled aria-disabled="true">Retry</button>
            <button id="correct-btn" data-testid="correct-btn" class="btn btn-secondary" type="button" disabled aria-disabled="true">Correct <span class="badge">Soon</span></button>
          </div>
        </div>
        <!-- Generation orientation (Hieu, Nov 8): tapping
             Generate on a paragraph first opens this shape
             chooser - landscape or portrait, so a portrait
             image can fit the phone screen edge-to-edge as a
             background. One tap on a shape generates in that
             shape and remembers the choice
             (writer.imageOrientation); the remembered shape
             is the preselected one next time, and on a fresh
             profile a phone-width viewport preselects
             portrait, a wide one landscape. -->
        <div id="orientation-chooser" data-testid="orientation-chooser" class="orientation-chooser" hidden>
          <span class="orientation-label">Image shape</span>
          <button id="orientation-landscape" data-testid="orientation-landscape" class="orientation-chip" type="button"
            aria-pressed="false" aria-label="Generate a landscape image" title="Landscape"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="6" width="19" height="12" rx="2"/></svg><span>Landscape</span></button>
          <button id="orientation-portrait" data-testid="orientation-portrait" class="orientation-chip" type="button"
            aria-pressed="false" aria-label="Generate a portrait image" title="Portrait"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="2.5" width="12" height="19" rx="2"/></svg><span>Portrait</span></button>
          <button id="orientation-cancel" data-testid="orientation-cancel" class="orientation-chip orientation-cancel" type="button"
            aria-label="Cancel" title="Cancel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        </div>
        <div class="composer">
          <textarea id="action-input" data-testid="action-input" class="input" rows="1"
            placeholder="What do you do? (*...* = instruction for the AI)"></textarea>
          <div class="composer-bar">
            <div class="composer-icons">
              <button id="suggest-toggle" data-testid="suggest-toggle" class="tool-btn" type="button"
                aria-expanded="false" aria-controls="suggest-panel" title="Show suggestions" aria-label="Show suggestions"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.3 2.2h4.6c.2-.9.6-1.6 1.3-2.2A6 6 0 0 0 12 3z"/></svg></button>
              <button id="continue-btn" data-testid="continue-btn" class="tool-btn" type="button"
                title="Continue the story" aria-label="Continue the story"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4.5 12.5 12 5 19.5zM12.5 4.5 20 12l-7.5 7.5z"/></svg></button>
            </div>
            <!-- Turns always stream (Hieu, Nov 7): the Stream
                 toggle is gone; every turn goes to the
                 streaming endpoint (see play.js). -->
            <!-- Scene audio (stream-audio v1, T3): auto-speak
                 flag (OFF by default, writer.autoSpeak) and
                 narrator voice (writer.narratorVoice) on the
                 same localStorage contract the future
                 reading-settings panel will bind to. The
                 toggle is a text button (Hieu, Nov 7): no
                 checkbox - font color and weight carry the
                 state (accent + bold = on, muted = off). -->
            <button id="auto-speak-toggle" data-testid="auto-speak-toggle" class="audio-toggle" type="button"
              aria-pressed="false" title="Audio: read each new scene aloud automatically once its audio is ready">Audio</button>
            <label class="voice-select" title="Narrator voice">
              <select id="narrator-voice" data-testid="narrator-voice" aria-label="Narrator voice">
                <option value="vendetti">Vendetti</option>
                <option value="klett">Klett</option>
              </select>
            </label>
            <!-- Send (Hieu, Nov 5): Enter now makes a new line;
                 this button sends the turn. -->
            <button id="send-btn" data-testid="send-btn" class="tool-btn send-btn" type="button"
              aria-label="Send" title="Send"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Background adjust bar (Hieu, Nov 8): shown only in
       adjust mode. Fill = cover (fills the screen, may
       crop); Fit = contain (whole image visible). The drag
       itself happens on the reading area while this bar is
       up; Done leaves adjust mode. -->
  <div id="bg-adjust-bar" data-testid="bg-adjust-bar" class="bg-adjust-bar" hidden>
    <span class="bg-adjust-label">Background</span>
    <button id="bg-fit-fill" data-testid="bg-fit-fill" class="bg-fit-chip" type="button" aria-pressed="true">Fill</button>
    <button id="bg-fit-fit" data-testid="bg-fit-fit" class="bg-fit-chip" type="button" aria-pressed="false">Fit</button>
    <button id="bg-adjust-done" data-testid="bg-adjust-done" class="bg-adjust-done" type="button">Done</button>
  </div>

  <p id="play-out" hidden>You are not signed in.
    <a href="./login.html">Sign in</a> to play.</p>
</div>
<script type="module" src="./play.js"></script>
</body>
</html>
