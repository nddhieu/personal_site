<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu - Story Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand-theme.css">
<link rel="stylesheet" href="../brand-components.css">
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./menu.css">
</head>
<body class="light-theme">
<nav id="app-shell" aria-label="Primary"></nav>
<main class="page-menu">
  <section class="menu-feed">
    <h1 class="menu-title">Menu</h1>
    <p id="welcome" class="menu-welcome" hidden></p>

    <div id="state-loading" class="loading-row">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading...</span>
    </div>

    <div id="state-in" hidden>
      <div class="menu-list">
        <div class="menu-row">
          <span class="menu-row-label" id="menu-theme-label">Theme</span>
          <button id="menu-theme" type="button" class="btn btn-ghost btn-sm" data-testid="theme-toggle" aria-labelledby="menu-theme-label" aria-pressed="false">Light</button>
        </div>
        <div class="menu-row">
          <span class="menu-row-label">Account</span>
          <button id="menu-logout" type="button" class="btn btn-ghost btn-sm" data-testid="menu-logout">Log out</button>
        </div>
      </div>
      <p id="menu-error" class="form-error" role="alert" hidden></p>
    </div>

    <div id="state-out" hidden>
      <p>You are not signed in.</p>
      <p id="out-note" class="menu-note" hidden></p>
      <a class="btn btn-primary" href="./login.html">Sign in</a>
    </div>
  </section>
</main>
<script type="module" src="./menu.js"></script>
</body>
</html>
